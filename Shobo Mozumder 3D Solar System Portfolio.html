    * {

    html, body {

      padding: 0;
      width: 100%;
      height: 100%;

      background-color: #030712;
      color: #f3f4f6;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: rgba(11, 17, 32, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.7);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.25);
    }

    /* 3D Planet Floating Labels Container */
    #planet-labels-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .planet-badge {
      position: absolute;
      top: 0;
      left: 0;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.2s ease;
      will-change: transform, opacity;
    }

    .planet-badge:hover {
      background: rgba(6, 182, 212, 0.35);
      border-color: #ffffff;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
      transform: translate(-50%, -115%) scale(1.08);
    }

    .planet-badge.active-target {
      background: rgba(168, 85, 247, 0.6) !important;
      border-color: #a855f7 !important;
      color: #ffffff !important;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.9) !important;
    }

    #info-drawer::-webkit-scrollbar {
      width: 6px;
    }
    #info-drawer::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    #info-drawer::-webkit-scrollbar-thumb {
      background: #0284c7;
      border-radius: 3px;
    }

    /* Terminal Output */
    .terminal-box {
      background: rgba(3, 7, 18, 0.92);
      font-family: 'Fira Code', monospace;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
  </style>

      } else if (cmd === 'contact') {

        responseText = 'Warping to Jupiter (Contact)...';
      } else if (cmd === 'clear') {

      } else {

      resLine.className = 'text-slate-400 pl-2 border-l border-amber-500/50';
      resLine.innerHTML = responseText;
      output.appendChild(resLine);

      output.scrollTop = output.scrollHeight;
      input.value = '';
    }

    /* =========================================================
       2. THREE.JS SOLAR SYSTEM 3D ENVIRONMENT
       ========================================================= */
    let scene, camera, renderer, controls;
    let celestialBodies = [];
    let interactableMeshes = [];
    let selectedBody = null;
    let isTransitioning = false;
    let targetCamPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();

    const initialCameraPos = new THREE.Vector3(0, 32, 55);

    // Planet Specs [id, name, radius, orbitDistance, color, speed]
    const celestialSpecs = [
      { id: 'sun',     name: '☀️ Sun',      role: 'Home',      r: 4.2, dist: 0,  color: 0xfbbf24, emissive: 0xfbbf24, speed: 0 },
      { id: 'mercury', name: '☿ Mercury',  role: 'About',     r: 0.8, dist: 9,  color: 0x94a3b8, speed: 0.015 },
      { id: 'venus',   name: '♀ Venus',    role: 'Skills',    r: 1.2, dist: 14, color: 0xf59e0b, speed: 0.011 },
      { id: 'earth',   name: '🌍 Earth',    role: 'Profile',   r: 1.4, dist: 20, color: 0x3b82f6, speed: 0.008 },
      { id: 'mars',    name: '♂ Mars',     role: 'Projects',  r: 1.1, dist: 28, color: 0xef4444, speed: 0.006 },
      { id: 'jupiter', name: '♃ Jupiter',  role: 'Contact',   r: 2.3, dist: 37, color: 0xa855f7, speed: 0.004 }
    ];

    window.onload = function () {
      initSolarSystem();
      animate();
    };

    function initSolarSystem() {
      const container = document.getElementById('webgl-container');
      const labelsOverlay = document.getElementById('planet-labels-overlay');

      // Scene
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030712, 0.008);

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.copy(initialCameraPos);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
      scene.add(ambientLight);

      const sunLight = new THREE.PointLight(0xffffff, 2.5, 200);
      scene.add(sunLight);

      // Starfield Background
      const starGeo = new THREE.BufferGeometry();
      const starCount = 2500;
      const starPositions = new Float32Array(starCount * 3);
      for(let i = 0; i < starCount * 3; i++) {
        starPositions[i] = (Math.random() - 0.5) * 400;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.55, transparent: true, opacity: 0.8 });
      const starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);

      // Build Celestial Objects
      celestialSpecs.forEach(spec => {
        // Orbit Ring Line
        if (spec.dist > 0) {
          const ringGeo = new THREE.RingGeometry(spec.dist - 0.06, spec.dist + 0.06, 128);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2;
          scene.add(ring);
        }

        const pivot = new THREE.Group();
        scene.add(pivot);

        const geo = new THREE.SphereGeometry(spec.r, 32, 32);
        const mat = new THREE.MeshStandardMaterial({
          color: spec.color,
          emissive: spec.emissive || 0x000000,
          roughness: 0.6,
          metalness: 0.2
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.x = spec.dist;
        mesh.userData = { id: spec.id, name: spec.name };
        pivot.add(mesh);

        // Add 3D DOM Badge Label
        const badgeEl = document.createElement('div');
        badgeEl.className = 'planet-badge';
        badgeEl.innerHTML = `${spec.name} <span class="text-[10px] opacity-75">(${spec.role})</span>`;
        badgeEl.onclick = () => selectCelestialBody(spec.id);
        labelsOverlay.appendChild(badgeEl);

        celestialBodies.push({
          id: spec.id,
          pivot: pivot,
          mesh: mesh,
          speed: spec.speed,
          el: badgeEl,
          radius: spec.r
        });

        interactableMeshes.push(mesh);

        // Add Moon Satellite to Earth
        if (spec.id === 'earth') {
          const moonPivot = new THREE.Group();
          mesh.add(moonPivot);

          const moonGeo = new THREE.SphereGeometry(0.45, 16, 16);
          const moonMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
          const moonMesh = new THREE.Mesh(moonGeo, moonMat);
          moonMesh.position.x = 2.8;
          moonMesh.userData = { id: 'moon', name: '🌙 Moon' };
          moonPivot.add(moonMesh);

          const moonBadgeEl = document.createElement('div');
          moonBadgeEl.className = 'planet-badge';
          moonBadgeEl.innerHTML = `🌙 Moon <span class="text-[10px] opacity-75">(Experience)</span>`;
          moonBadgeEl.onclick = () => selectCelestialBody('moon');
          labelsOverlay.appendChild(moonBadgeEl);

          celestialBodies.push({
            id: 'moon',
            pivot: moonPivot,
            mesh: moonMesh,
            speed: 0.025,
            el: moonBadgeEl,
            radius: 0.45
          });

          interactableMeshes.push(moonMesh);
        }
      });

      // Window Events
      window.addEventListener('resize', onWindowResize);

      // Raycaster Click Handler
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (e) => {
        if (e.target.closest('#info-drawer') || e.target.closest('#project-modal') || e.target.closest('header')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactableMeshes);

        if (intersects.length > 0) {
          const clickedMesh = intersects[0].object;
          if (clickedMesh.userData && clickedMesh.userData.id) {
            selectCelestialBody(clickedMesh.userData.id);
          }
        }
      });

      document.getElementById('reset-orbit-btn').addEventListener('click', resetToOrbitView);
      document.getElementById('close-drawer-btn').addEventListener('click', resetToOrbitView);
    }

    function selectCelestialBody(id) {
      const bodyObj = celestialBodies.find(b => b.id === id);
      if (!bodyObj) return;

      selectedBody = bodyObj;
      const data = portfolioPages[id];
      if (!data) return;

      // Render Drawer Page
      const contentContainer = document.getElementById('drawer-content');
      contentContainer.innerHTML = data.render();

      // Highlight active badge
      celestialBodies.forEach(b => {
        if (b.el) b.el.classList.remove('active-target');
      });
      if (bodyObj.el) bodyObj.el.classList.add('active-target');

      // Open side drawer
      document.getElementById('info-drawer').classList.remove('translate-x-full');

      isTransitioning = true;
    }

    function resetToOrbitView() {
      selectedBody = null;
      celestialBodies.forEach(b => {
        if (b.el) b.el.classList.remove('active-target');
      });

      document.getElementById('info-drawer').classList.add('translate-x-full');

      targetCamPos.copy(initialCameraPos);
      targetLookAt.set(0, 0, 0);
      isTransitioning = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Update Floating Badges to 2D Screen Positions
    function updatePlanetBadges() {
      const tempVec = new THREE.Vector3();
      const halfW = window.innerWidth / 2;
      const halfH = window.innerHeight / 2;

      celestialBodies.forEach(b => {
        if (!b.el) return;

        tempVec.setFromMatrixPosition(b.mesh.matrixWorld);
        tempVec.project(camera);

        const x = (tempVec.x * halfW) + halfW;
        const y = -(tempVec.y * halfH) + halfH;

        if (tempVec.z < 1) {
          b.el.style.transform = `translate(-50%, -100%) translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
          b.el.style.display = 'block';
        } else {
          b.el.style.display = 'none';
        }
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      // Rotate planet orbits
      celestialBodies.forEach(b => {
        if (b.pivot) b.pivot.rotation.y += b.speed * 0.5;
        if (b.mesh) b.mesh.rotation.y += 0.008;
      });

      // Target Camera Camera Tracking
      if (selectedBody) {
        const worldPos = new THREE.Vector3();
        selectedBody.mesh.getWorldPosition(worldPos);

        const r = selectedBody.radius || 1;
        const offset = new THREE.Vector3(0, r * 2.2, r * 4.8);
        
        targetCamPos.copy(worldPos).add(offset);
        targetLookAt.copy(worldPos);
      }

      if (isTransitioning || selectedBody) {
        camera.position.lerp(targetCamPos, 0.05);
        controls.target.lerp(targetLookAt, 0.05);
        controls.update();

        if (camera.position.distanceTo(targetCamPos) < 0.1) {
          isTransitioning = false;
        }
      } else {
        controls.update();
      }

      renderer.render(scene, camera);
      updatePlanetBadges();
    }
  </script>
</body>
</html>
